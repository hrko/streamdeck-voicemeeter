name: Windows build
on:
  push:
    branches: [rust]
    tags: ['rust-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.3
          install: false
          cache: false
      - name: Install locked tools and dependencies
        run: mise run setup
      - name: Validate, test, build and package
        run: mise run ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voicemeeter-windows-x64
          if-no-files-found: error
          path: |
            dist/*.streamDeckPlugin
            dist/*.sha256
            dist/licenses/**
