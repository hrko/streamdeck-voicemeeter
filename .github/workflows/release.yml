name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching Cargo.toml (for example rust-v0.1.0)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: voicemeeter-windows-x64
          path: dist
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.3
          install: false
          cache: false
      - name: Install locked Node
        shell: pwsh
        run: mise install --locked node
      - name: Create draft and attach verified package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: mise exec node -- node scripts/draft-release.mjs
