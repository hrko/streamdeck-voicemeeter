[package]
name = "streamdeck-voicemeeter"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
default-run = "streamdeck-voicemeeter"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streamdeck-plugin = "=0.1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
ttf-parser = "0.25"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
voicemeeter = "=0.4.0"
