[package]
name = "streamdeck-voicemeeter"
version = "0.1.5"
edition = "2024"
license-file = "LICENSE"
publish = false
default-run = "streamdeck-voicemeeter"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streamdeck-plugin = { version = "=0.1.0", features = ["typegen"] }
ts-rs = { version = "10.1", features = ["serde-compat"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ttf-parser = "0.25"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
voicemeeter = "=0.4.0"
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_System_Threading", "Win32_Security"] }
