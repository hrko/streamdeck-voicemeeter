min_version = "2026.10.3"

[settings]
lockfile = true
minimum_release_age = "7d"

[settings.task]
run_auto_install = false

[tools]
node = "24"
pnpm = "11"
rust = "1.99"

[tasks.setup]
run = ["mise install --locked node pnpm rust", "mise exec node rust -- node scripts/setup-rust.mjs", "mise exec node pnpm rust -- pnpm install --frozen-lockfile", "mise exec node pnpm rust -- node scripts/doctor.mjs"]

[tasks."check:locales"]
run = "node scripts/check-locales.mjs"

[tasks.types]
run = "cargo run --locked --bin typegen"

[tasks."check:rust"]
run = ["cargo fmt --check", "cargo clippy --locked --all-targets -- -D warnings", "cargo run --locked --bin typegen -- --check"]

[tasks."check:pi"]
run = "pnpm --filter @streamdeck-voicemeeter/pi exec tsc --noEmit"

[tasks.check]
depends = ["check:rust", "check:pi", "check:locales"]

[tasks."test:rust"]
run = "cargo test --locked"

[tasks."test:pi"]
run = ["pnpm --filter @streamdeck-voicemeeter/pi exec vitest run", "node --test scripts/check-locales.test.mjs scripts/build-plugin.test.mjs scripts/dependency-policy.test.mjs"]

[tasks.test]
depends = ["test:rust", "test:pi", "test:native"]

[tasks."test:native"]
run = ["cargo build --locked --bin streamdeck-voicemeeter", "node scripts/smoke-native.mjs debug"]

[tasks.build]
run = ["cargo build --locked --release --bin streamdeck-voicemeeter", "pnpm --filter @streamdeck-voicemeeter/pi exec vite build", "node scripts/build-plugin.mjs release", "node scripts/licenses.mjs"]

[tasks."package:validate"]
run = ["node scripts/verify-package.mjs", "pnpm exec streamdeck validate --no-update-check dist/jp.hrko.streamdeck.voicemeeter.rust.sdPlugin"]

[tasks.licenses]
run = "node scripts/licenses.mjs"

[tasks.package]
run = ["mise run build", "node scripts/smoke-native.mjs release", "node scripts/verify-package.mjs", "pnpm exec streamdeck pack --no-update-check --no-file-list --force --output dist dist/jp.hrko.streamdeck.voicemeeter.rust.sdPlugin", "pwsh -NoProfile -File scripts/verify-archive.ps1", "node scripts/verify-package.mjs --checksum"]

[tasks.dev]
run = "node scripts/dev.mjs"

[tasks.ci]
run = ["mise run check", "mise run test", "mise run package", "git diff --exit-code -- mise.lock pnpm-lock.yaml Cargo.lock"]

[tasks."deps:update"]
run = "node scripts/update-dependencies.mjs"

[tasks."deps:audit"]
run = "node scripts/update-dependencies.mjs --audit"
